<ng-container *ngIf="showFullNavbar; else minimalNav">
  <app-navbar></app-navbar>
</ng-container>

<ng-template #minimalNav>
  <div class="flex justify-end gap-4 p-4 bg-white shadow">
    <a
      routerLink="/login"
      class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition-colors duration-200"
    >
      Login
    </a>
    <a
      routerLink="/register"
      class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition-colors duration-200"
    >
      Register
    </a>
  </div>
</ng-template>

<router-outlet></router-outlet>
