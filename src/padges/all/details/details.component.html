<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product List</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">

<main class="max-w-6xl mx-auto p-6">
  <h1 class="text-3xl font-bold text-center mb-8">Product Details</h1>

  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 flex flex-col md:flex-row gap-6">
    <!-- الصورة -->
    <div class="md:w-1/2 w-full flex justify-center items-center">
      <img [src]="detail.image" alt="Product Image" class="w-full h-64 object-contain" />
    </div>

    <!-- التفاصيل -->
    <div class="md:w-1/2 w-full flex flex-col justify-between">
      <div>
        <h3 class="text-2xl font-semibold mb-2">{{ detail.title }}</h3>
        <p class="text-green-500 font-bold text-xl mb-2">${{ detail.price }}</p>
        <p class="text-gray-700 dark:text-gray-300 text-sm mb-4">{{ detail.description }}</p>
      </div>

      <button class="bg-green-500 hover:bg-green-600 text-white py-2 px-6 rounded transition w-fit self-start mt-4 md:mt-0">
        View Product
      </button>
    </div>
  </div>
</main>

</body>
</html>
