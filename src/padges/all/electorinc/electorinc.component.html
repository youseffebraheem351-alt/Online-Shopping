<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Electronics Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans min-h-screen">

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
      <!-- Title -->
      <h2 class="text-2xl font-bold mb-6">All Products</h2>

      <!-- Products Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

        @for (item of Elector; track $index) {
          <div 
            (click)="goToDetails(item.id)"
            class="bg-white dark:bg-gray-800 border dark:border-gray-700 rounded-lg p-4 hover:shadow-lg transition flex flex-col cursor-pointer"
          >
            <img [src]="item.image" alt="Product Image" class="h-48 w-full object-contain mb-4" />
            <h3 class="text-lg font-semibold mb-1 line-clamp-2">{{item.title}}</h3>
            <p class="text-orange-500 font-bold mb-1">${{item.price}}</p>
            <p class="text-gray-500 dark:text-gray-300 text-sm mb-4 line-clamp-3">{{item.description}}</p>

            <!-- الأيقونات فوق زرار Add to Cart -->
            <div class="flex space-x-3 mb-2">
              <a
                [routerLink]="['/details', item.id]"
                routerLinkActive="text-purple-600"
                [routerLinkActiveOptions]="{ exact: true }"
                class="bg-white p-2 rounded shadow cursor-pointer text-black hover:text-purple-600 transition"
                title="View Details"
                aria-label="View Details"
                (click)="$event.stopPropagation()"
              >
                <!-- SVG أيقونة العين -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-6 h-6">
                  <path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
                  <circle cx="12" cy="12" r="2.5"/>
                </svg>
              </a>

              <button
                (click)="toggleWishlist(item); $event.stopPropagation()"
                [ngClass]="{
                  'text-purple-600': isInWishlist(item.id),
                  'text-black': !isInWishlist(item.id)
                }"
                class="bg-white p-2 rounded shadow cursor-pointer hover:text-purple-600 transition"
                aria-label="Toggle Wishlist"
                title="Toggle Wishlist"
                type="button"
              >
                <!-- SVG أيقونة القلب -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-6 h-6">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42
                           4.42 3 7.5 3c1.74 0 3.41 0.81 4.5 2.09C13.09 3.81
                           14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4
                           6.86-8.55 11.54L12 21.35z"/>
                </svg>
              </button>
            </div>

            <button
              (click)="addToCart(item); $event.stopPropagation()"
              class="mt-auto bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded transition"
            >
              Add to Cart
            </button>
          </div>
        }
      </div>
    </div>

  </body>
</html>
