<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-gray-100">

<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-3xl font-bold text-center mb-6 text-gray-800">Create Account</h2>

    <!-- رسالة الخطأ -->
    <div *ngIf="errorMessage" class="bg-red-100 text-black p-3 rounded-xl mb-4 text-center font-semibold">
      {{ errorMessage }}
    </div>

    <form #registerForm="ngForm" (ngSubmit)="onRegister()" novalidate>

      <div class="mb-4">
        <label for="email" class="block text-gray-600 mb-1">Email</label>
        <input
          type="email"
          id="email"
          required
          name="email"
          [(ngModel)]="registerData.email"
          class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
      </div>

      <div class="mb-4">
        <label for="password" class="block text-gray-600 mb-1">Password</label>
        <input
          type="password"
          id="password"
          required
          name="password"
          [(ngModel)]="registerData.password"
          class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
      </div>

      <div class="mb-6">
        <label for="confirmPassword" class="block text-gray-600 mb-1">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          required
          name="confirmPassword"
          [(ngModel)]="registerData.confirmPassword"
          class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
      </div>

      <button
        type="submit"
        [disabled]="
          !registerForm.valid || registerData.password !== registerData.confirmPassword
        "
        class="w-full bg-green-500 text-white py-2 rounded-xl hover:bg-green-600 transition disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Register
      </button>

    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      Already have an account?
      <a routerLink="/login" class="text-green-600 hover:underline">Login here</a>
    </p>
  </div>
</div>



</body>
</html>
