<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-gray-100">

  <div class="min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
      <h2 class="text-3xl font-bold text-center mb-6 text-gray-800">Login</h2>

      <!-- ✅ رسالة الخطأ -->
      <div *ngIf="errorMessage" class="bg-red-100 text-black p-3 rounded-xl mb-4 text-center font-semibold">
        {{ errorMessage }}
      </div>

      <form (ngSubmit)="onLogin()" #loginForm="ngForm" novalidate>

        <div class="mb-4">
          <label for="email" class="block text-gray-600 mb-1">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            [(ngModel)]="loginData.email"
            class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500"
          />
        </div>

        <div class="mb-6">
          <label for="password" class="block text-gray-600 mb-1">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            [(ngModel)]="loginData.password"
            class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500"
          />
        </div>

        <button
          type="submit"
          [disabled]="!loginForm.valid"
          class="w-full bg-green-500 text-white py-2 rounded-xl hover:bg-green-600 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Login
        </button>

      </form>

      <p class="text-center text-sm text-gray-600 mt-6">
        Don't have an account?
        <a routerLink="/register" class="text-green-600 hover:underline">Register now</a>
      </p>
    </div>
  </div>

</body>
</html>
